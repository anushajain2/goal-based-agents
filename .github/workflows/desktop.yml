# Builds the Autopilot Helper installers (macOS, Windows, Linux).
#   Release: push a tag like helper-v0.1.0 -> installers are attached to a GitHub release, which is
#   where the app's "Download" button points (HELPER_DOWNLOAD_URL, default: releases/latest).
#   Any time: Actions -> Desktop helper -> Run workflow (installers appear as build artifacts).
#
# Signing (optional, recommended before customers use it): add these repository secrets and the
# builds are signed automatically. Without them, macOS asks people to right-click -> Open the
# first time, and Windows shows a SmartScreen "More info -> Run anyway" prompt.
#   macOS:   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CERT_P12_BASE64, WIN_CERT_PASSWORD
name: Desktop helper

on:
  push:
    tags: ["helper-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12_BASE64 || matrix.os == 'windows-latest' && secrets.WIN_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_PASSWORD || matrix.os == 'windows-latest' && secrets.WIN_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/helper-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Autopilot Helper ${{ github.ref_name }}
          body: |
            Download the installer for your computer, open it, then connect it from Autopilot (Connections → Desktop helper).
            - Mac (Apple silicon: M1/M2/M3/M4): the `mac-arm64.dmg`
            - Mac (Intel): the `mac-x64.dmg`
            - Windows: the `.exe`
            - Linux: the `.AppImage`
          files: installers/*
          make_latest: true
