# Builds the Autopilot Helper installers (macOS, Windows, Linux).
#   Release: bump "version" in desktop/package.json and push to main. If there's no release for that
#   version yet (helper-v<version>), the installers are built and published as a GitHub release,
#   which is where the app's "Download" button points (HELPER_DOWNLOAD_URL, default: releases/latest).
#   Pushing a tag like helper-v0.2.0 also releases. Any other change under desktop/ just builds.
#   Any time: Actions -> Desktop helper -> Run workflow (installers appear as build artifacts).
#
# Signing (optional, recommended before customers use it): add these repository secrets and the
# builds are signed automatically. Without them, macOS asks people to right-click -> Open the
# first time, and Windows shows a SmartScreen "More info -> Run anyway" prompt.
#   macOS:   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CERT_P12_BASE64, WIN_CERT_PASSWORD
name: Desktop helper

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
    tags: ["helper-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="helper-v$(node -p "require('./desktop/package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" = "refs/tags/$tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ] && ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"   # a version that hasn't been released yet
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12_BASE64 || matrix.os == 'windows-latest' && secrets.WIN_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_PASSWORD || matrix.os == 'windows-latest' && secrets.WIN_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Autopilot Helper ${{ needs.version.outputs.tag }}
          body: |
            Download the installer for your computer, open it, then connect it from Autopilot (Connections → Desktop helper).
            - Mac (Apple silicon: M1/M2/M3/M4): the `mac-arm64.dmg`
            - Mac (Intel): the `mac-x64.dmg`
            - Windows: the `.exe`
            - Linux: the `.AppImage`
          files: installers/*
          make_latest: true
