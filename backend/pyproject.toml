[project]
name = "autopilot-backend"
version = "0.1.0"
description = "Goal-based marketing agents: budget + goal in, autonomous (permissioned) actions out."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=2.8.0",
    "composio>=0.32.0",
    "playwright>=1.55",
    "cryptography>=43",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "sentry-sdk>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's Depends() in defaults is idiomatic. S110: best-effort cleanup paths are deliberate.
ignore = ["B008", "S110"]
