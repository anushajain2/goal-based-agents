services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: autopilot
      POSTGRES_PASSWORD: autopilot
      POSTGRES_DB: autopilot
    ports:
      - "5433:5432"
    volumes:
      - autopilot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  autopilot-db:
